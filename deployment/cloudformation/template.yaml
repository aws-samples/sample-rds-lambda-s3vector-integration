AWSTemplateFormatVersion: '2010-09-09'
Description: 'RDS Lambda S3Vector Integration - Lambda function for Aurora PostgreSQL to S3 Vector integration'

Parameters:
  # === AURORA CLUSTER CONFIGURATION ===
  AuroraClusterArn:
    Type: String
    Description: |
      Full ARN of your Amazon Aurora cluster for tagging and identification.
      
      Format: arn:aws:rds:REGION:ACCOUNT_ID:cluster:CLUSTER_NAME
      How to find: RDS Console > Databases > Select cluster > Configuration tab > Resource ID section
      Example: arn:aws:rds:us-west-2:123456789012:cluster:production-aurora-cluster
      
      Requirements: Aurora PostgreSQL 13.7+ (for aws_lambda extension support)
      Note: The cluster identifier will be automatically extracted from this ARN.
    AllowedPattern: '^arn:aws:rds:[^:]+:[^:]+:cluster:[^:]+$'
    ConstraintDescription: 'Must be a valid Aurora cluster ARN'

  # === NETWORK CONFIGURATION ===
  VpcId:
    Type: AWS::EC2::VPC::Id
    Description: |
      VPC ID where your Aurora cluster is deployed. The AWS Lambda function will be deployed in the same VPC.
      
      How to find: RDS Console > Databases > Select cluster > Connectivity & security tab > VPC
      Or: EC2 Console > VPC > Your VPCs
      Example: vpc-0123456789abcdef0

  SubnetIds:
    Type: List<AWS::EC2::Subnet::Id>
    Description: |
      Subnet IDs for Lambda function deployment. Use the same subnets as your Aurora cluster.
      
      How to find: RDS Console > Databases > Select cluster > Connectivity & security tab > Subnets
      Or: RDS Console > Subnet groups > Select your cluster's subnet group
      Select 2-3 subnets in different Availability Zones for high availability.

  # === RESOURCE NAMING ===
  ResourcePrefix:
    Type: String
    Description: |
      Prefix for naming AWS resources (IAM roles, Lambda functions, etc.).
      
      This prefix is used to name all resources created by this stack, ensuring they follow
      AWS naming conventions regardless of the stack name chosen.
      
      Requirements: Must be 1-20 characters, lowercase letters, numbers, and hyphens only.
      Example: s3vl, my-app, prod-vectors
    Default: s3vl
    MinLength: 1
    MaxLength: 20
    AllowedPattern: '^[a-z0-9-]+$'
    ConstraintDescription: 'Must be 1-20 characters: lowercase letters, numbers, and hyphens only'

  # === LAMBDA FUNCTION CONFIGURATION ===
  LambdaTimeout:
    Type: Number
    Description: |
      Lambda function timeout in seconds (3-900). Consider S3 Vector API response times plus network latency.
      
      Recommendations:
      - Light workloads (single vector queries): 15-30 seconds
      - Heavy workloads (batch operations): 60-120 seconds  
      - Large batch processing: 300-900 seconds
      
      Note: Longer timeouts may be needed for complex vector operations or large result sets.
    Default: 10
    MinValue: 3
    MaxValue: 900

  LambdaMemorySize:
    Type: Number
    Description: |
      Lambda function memory allocation in MB (128-10240). More memory provides faster CPU and better performance.
      
      Recommendations:
      - Small vectors (< 1000 dimensions): 256-512 MB
      - Large vectors (1000+ dimensions): 512-1024 MB
      - Batch operations or large result sets: 1024-3008 MB
      
      Note: Memory allocation affects both RAM and CPU performance. Higher memory = faster processing.
    Default: 128
    MinValue: 128
    MaxValue: 10240



Resources:
  # Dedicated Security Group for Lambda function (least-privilege network access)
  LambdaSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: !Sub '${ResourcePrefix} - Lambda function egress-only SG'
      VpcId: !Ref VpcId
      SecurityGroupEgress:
        - IpProtocol: tcp
          FromPort: 443
          ToPort: 443
          CidrIp: 0.0.0.0/0
          Description: HTTPS to S3 Vectors API (via NAT Gateway or VPC endpoint)
      Tags:
        - Key: AuroraClusterArn
          Value: !Ref AuroraClusterArn
        - Key: Component
          Value: Sample-RDS-Lambda-S3Vector-Integration

  # Dead Letter Queue for Lambda function
  LambdaDeadLetterQueue:
    Type: AWS::SQS::Queue
    Properties:
      QueueName: !Sub '${ResourcePrefix}-lambda-dlq'
      MessageRetentionPeriod: 1209600  # 14 days (maximum retention)
      KmsMasterKeyId: alias/aws/sqs
      Tags:
        - Key: AuroraClusterArn
          Value: !Ref AuroraClusterArn
        - Key: Component
          Value: Sample-RDS-Lambda-S3Vector-Integration

  # S3 Vector Bucket with auto-generated name
  # CloudFormation generates unique names: StackName-LogicalID-RandomString (e.g., MyStack-S3VectorBucket-abcdefghijk1)
  # Actual bucket name available in stack outputs after deployment.
  S3VectorBucket:
    Type: AWS::S3Vectors::VectorBucket

  # S3 Vector Index
  # !Ref S3VectorBucket returns ARN format: arn:aws:s3vectors:region:account:bucket/bucket-name
  # Extract bucket name by splitting on '/' and taking the second part
  S3VectorIndex:
    Type: AWS::S3Vectors::Index
    Properties:
      VectorBucketName: !Select [1, !Split ['/', !GetAtt S3VectorBucket.VectorBucketArn]]
      IndexName: !Sub '${ResourcePrefix}-index-5d'
      DataType: float32
      Dimension: 5
      DistanceMetric: cosine
  # Lambda Execution Policy
  LambdaExecutionPolicy:
    Type: AWS::IAM::ManagedPolicy
    Properties:
      Description: 'Policy for Lambda function to access S3 Vector services and CloudWatch logs'
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Action:
              - s3vectors:QueryVectors
              - s3vectors:GetVectors
              - s3vectors:ListIndexes
              - s3vectors:GetIndex
              - s3vectors:ListVectors
            Resource: !GetAtt S3VectorIndex.IndexArn
          - Effect: Allow
            Action:
              - s3vectors:ListVectorIndexes
            Resource: !GetAtt S3VectorBucket.VectorBucketArn
          - Effect: Allow
            Action:
              - logs:CreateLogGroup
              - logs:CreateLogStream
              - logs:PutLogEvents
            Resource: !Sub 'arn:aws:logs:${AWS::Region}:${AWS::AccountId}:log-group:/aws/lambda/*'
          - Effect: Allow
            Action:
              - sqs:SendMessage
            Resource: !GetAtt LambdaDeadLetterQueue.Arn

  # Lambda Execution Role
  LambdaExecutionRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaVPCAccessExecutionRole
        - !Ref LambdaExecutionPolicy
      Tags:
        - Key: IndexArn
          Value: !GetAtt S3VectorIndex.IndexArn
        - Key: AuroraClusterArn
          Value: !Ref AuroraClusterArn
        - Key: Component
          Value: Sample-RDS-Lambda-S3Vector-Integration

  # Aurora Lambda Invocation Policy
  AuroraLambdaPolicy:
    Type: AWS::IAM::ManagedPolicy
    Properties:
      Description: 'Policy for Aurora cluster to invoke Lambda functions'
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Action:
              - lambda:InvokeFunction
            Resource: !GetAtt VectorQueryLambda.Arn

  # Aurora Cluster Role for Lambda Invocation
  AuroraLambdaRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: rds.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - !Ref AuroraLambdaPolicy
      Tags:
        - Key: IndexArn
          Value: !GetAtt S3VectorIndex.IndexArn
        - Key: AuroraClusterArn
          Value: !Ref AuroraClusterArn
        - Key: Component
          Value: Sample-RDS-Lambda-S3Vector-Integration

  # Lambda Function
  VectorQueryLambda:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: !Sub '${ResourcePrefix}-vector-query'
      Runtime: python3.11
      Handler: lambda_function.lambda_handler
      Role: !GetAtt LambdaExecutionRole.Arn
      Timeout: !Ref LambdaTimeout
      MemorySize: !Ref LambdaMemorySize
      ReservedConcurrentExecutions: 5
      DeadLetterConfig:
        TargetArn: !GetAtt LambdaDeadLetterQueue.Arn
      Code:
        ZipFile: |
          import json
          import logging
          
          logger = logging.getLogger()
          logger.setLevel(logging.INFO)
          
          def lambda_handler(event, context):
              """
              Placeholder Lambda function for Sample-RDS-S3Vector integration
              This will be replaced with actual implementation
              """
              logger.info(f"Received event: {json.dumps(event)}")
              
              return {
                  'statusCode': 200,
                  'body': json.dumps({
                      'success': True,
                      'message': 'Lambda function deployed successfully',
                      'results': [],
                      'execution_time_ms': 0
                  })
              }
      VpcConfig:
        SecurityGroupIds:
          - !GetAtt LambdaSecurityGroup.GroupId
        SubnetIds: !Ref SubnetIds
      Tags:
        - Key: IndexArn
          Value: !GetAtt S3VectorIndex.IndexArn
        - Key: AuroraClusterArn
          Value: !Ref AuroraClusterArn
        - Key: Component
          Value: Sample-RDS-Lambda-S3Vector-Integration

  # Lambda Function Version
  VectorQueryLambdaVersion:
    Type: AWS::Lambda::Version
    Properties:
      FunctionName: !Ref VectorQueryLambda
      Description: 'Initial version of Vector Query Lambda'

  # Lambda Function Alias
  VectorQueryLambdaAlias:
    Type: AWS::Lambda::Alias
    Properties:
      FunctionName: !Ref VectorQueryLambda
      FunctionVersion: !GetAtt VectorQueryLambdaVersion.Version
      Name: LIVE
      Description: 'Live alias for Vector Query Lambda'

  # CloudWatch Log Group
  LambdaLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub '/aws/lambda/${VectorQueryLambda}'
      RetentionInDays: 14
      Tags:
        - Key: IndexArn
          Value: !GetAtt S3VectorIndex.IndexArn
        - Key: AuroraClusterArn
          Value: !Ref AuroraClusterArn
        - Key: Component
          Value: Sample-RDS-Lambda-S3Vector-Integration

Outputs:
  LambdaFunctionArn:
    Description: 'ARN of the Vector Query Lambda function'
    Value: !GetAtt VectorQueryLambda.Arn
    Export:
      Name: !Sub '${AWS::StackName}-LambdaArn'

  LambdaFunctionName:
    Description: 'Name of the Vector Query Lambda function'
    Value: !Ref VectorQueryLambda
    Export:
      Name: !Sub '${AWS::StackName}-LambdaName'

  LambdaExecutionRoleArn:
    Description: 'ARN of the Aurora Lambda execution role'
    Value: !GetAtt LambdaExecutionRole.Arn
    Export:
      Name: !Sub '${AWS::StackName}-AuroraLambdaExecutionRoleArn'

  AuroraLambdaRoleArn:
    Description: 'ARN of the Aurora Lambda execution role'
    Value: !GetAtt AuroraLambdaRole.Arn
    Export:
      Name: !Sub '${AWS::StackName}-AuroraLambdaRoleArn'

  AuroraClusterIdentifier:
    Description: 'Aurora cluster identifier extracted from ARN'
    Value: !Select [6, !Split [':', !Ref AuroraClusterArn]]
    Export:
      Name: !Sub '${AWS::StackName}-ClusterIdentifier'

  S3VectorBucketName:
    Description: 'S3 Vectors bucket name created for this deployment'
    Value: !Select [1, !Split ['/', !GetAtt S3VectorBucket.VectorBucketArn]]
    Export:
      Name: !Sub '${AWS::StackName}-BucketName'

  S3VectorBucketArn:
    Description: 'S3 Vectors bucket ARN'
    Value: !GetAtt S3VectorBucket.VectorBucketArn
    Export:
      Name: !Sub '${AWS::StackName}-BucketArn'

  S3VectorIndexArn:
    Description: 'Vector index ARN created for this deployment'
    Value: !GetAtt S3VectorIndex.IndexArn
    Export:
      Name: !Sub '${AWS::StackName}-IndexArn'

  AuroraRoleAttachmentCommand:
    Description: 'AWS CLI command to associate Aurora Lambda role with cluster'
    Value: !Sub 
      - 'aws rds add-role-to-db-cluster --db-cluster-identifier ${ClusterIdentifier} --role-arn ${AuroraLambdaRole.Arn} --feature-name Lambda --region ${AWS::Region}'
      - ClusterIdentifier: !Select [6, !Split [':', !Ref AuroraClusterArn]]

  AuroraClusterArn:
    Description: 'Aurora cluster ARN for this deployment'
    Value: !Ref AuroraClusterArn
    Export:
      Name: !Sub '${AWS::StackName}-ClusterArn'

  DeadLetterQueueArn:
    Description: 'ARN of the Dead Letter Queue for failed Lambda invocations'
    Value: !GetAtt LambdaDeadLetterQueue.Arn
    Export:
      Name: !Sub '${AWS::StackName}-DLQArn'

  DeadLetterQueueUrl:
    Description: 'URL of the Dead Letter Queue for monitoring failed invocations'
    Value: !Ref LambdaDeadLetterQueue
    Export:
      Name: !Sub '${AWS::StackName}-DLQUrl'

  LambdaSecurityGroupId:
    Description: 'Security group ID created for the Lambda function (egress-only, port 443)'
    Value: !GetAtt LambdaSecurityGroup.GroupId
    Export:
      Name: !Sub '${AWS::StackName}-LambdaSecurityGroupId'